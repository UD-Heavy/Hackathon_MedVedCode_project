<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{info.head.title}"></title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" type="text/css" th:href="@{/css/info.css}"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="svg-container">
            <img th:src="@{/img/logo_main.png}" alt="Logo">
        </div>
        <nav>
            <form action="/auth/login" method="get">
                <button type="submit" class="book-now" th:text="#{info.header.loginButton}"></button>
            </form>
            <form action="">
                <select id="language-select" name="lang" onchange="this.form.submit()">
                    <option value="" disabled selected hidden th:text="#{info.header.language}"></option>
                    <option value="ru">Русский</option>
                    <option value="en">English</option>
                </select>
            </form>
        </nav>
    </header>
    <main>
        <!-- Основной контент: изображение и текст о проекте -->
        <div class="main-content">
            <div class="doctor-container">
                <img th:src="@{/img/doctor.png}" alt="Doctor" class="doctor-image">
            </div>
            <section class="content">
                <p th:text="#{info.projectInfo}"></p>
            </section>
        </div>
    </main>

    <!-- Раздел с информацией о разработчиках -->
    <section class="developers">
        <h2 th:text="#{info.team.title}"></h2>
        <ul>
            <li><strong th:text="#{info.team.member.ananyev.name}"></strong> — <span th:text="#{info.team.member.ananyev.role}"></span></li>
            <li><strong th:text="#{info.team.member.mitrofanov.name}"></strong> — <span th:text="#{info.team.member.mitrofanov.role}"></span></li>
            <li><strong th:text="#{info.team.member.kripunov.name}"></strong> — <span th:text="#{info.team.member.kripunov.role}"></span></li>
            <li><strong th:text="#{info.team.member.medvedev.name}"></strong> — <span th:text="#{info.team.member.medvedev.role}"></span></li>
            <li><strong th:text="#{info.team.member.natochiy.name}"></strong> — <span th:text="#{info.team.member.natochiy.role}"></span></li>
        </ul>
    </section>
</body>
</html>
