<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страница аутентификации</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" type="text/css" th:href="@{/css/login.css}"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <!--    <script type="text/javascript" th:src="@{/js/login.js}"/>-->
</head>
<body>
<div class="language-switcher">
    <button class="lang-btn" onclick="changeLanguage('ru')">RU</button>
    <button class="lang-btn" onclick="changeLanguage('en')">EN</button>
</div>
<div class="login-container">
    <h2><img th:src="@{/img/logo.svg}" alt="Logo" style="vertical-align: middle; margin-right: 10px;">MeдВед.Код</h2>
    <form name="f" method="post" action="/process_login">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <input type="text" placeholder="Имя пользователя" name="username" id="username">
        <div class="password-container">
            <div class="password-wrapper">
                <input type="password" placeholder="Пароль" name="password" id="password">
                <span class="toggle-password" onclick="togglePassword()" aria-label="Показать пароль">
                    <i class="fas fa-eye"></i>
                </span>
            </div>
<!--            <a href="#" class="forgot-password">Забыли пароль?</a>-->
            <div class="caps-warning" id="capsWarning">Включен Caps Lock!</div>
        </div>
        <button type="submit">Войти</button>
        <div th:if="${param.error}" style="color: red">
            Неправильные имя или пароль
        </div>
        <script type="text/javascript" th:inline="javascript">
            const capsWarning = document.getElementById('capsWarning');

            // Функция для обновления состояния Caps Lock
            function updateCapsLockState(event) {
                const isCapsLockOn = event.getModifierState && event.getModifierState('CapsLock');
                capsWarning.style.display = isCapsLockOn ? 'block' : 'none';
            }

            // Проверка при нажатии клавиши
            document.addEventListener('keydown', function (event) {
                updateCapsLockState(event);
            });

            // Проверка при отпускании клавиши
            document.addEventListener('keyup', function (event) {
                updateCapsLockState(event);
            });

            // Инициализация состояния при загрузке страницы
            document.addEventListener('DOMContentLoaded', function () {
                // Создаем фиктивное событие для проверки начального состояния
                const event = new KeyboardEvent('keydown');
                updateCapsLockState(event);
            });

            // Проверка при клике (для случаев, когда Caps Lock изменяется без клавиш)
            document.addEventListener('click', function (event) {
                updateCapsLockState(event);
            });

            function togglePassword() {
                const passwordField = document.getElementById("password");
                const toggleIcon = document.querySelector(".toggle-password i");

                if (passwordField.type === "password") {
                    passwordField.type = "text";
                    toggleIcon.classList.remove("fa-eye");
                    toggleIcon.classList.add("fa-eye-slash");
                } else {
                    passwordField.type = "password";
                    toggleIcon.classList.remove("fa-eye-slash");
                    toggleIcon.classList.add("fa-eye");
                }
            }
        </script>
    </form>
</div>
<script src="login.js"></script>
</body>
</html>
