<!DOCTYPE html>
<html lang="en">
    <html lang="en" xmlns:th="http://www.thymeleaf.org">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Страница аутентификации</title>
            <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
            <link rel="stylesheet" type="text/css" th:href="@{/css/info.css}"/>
            <link rel="preconnect" href="https://fonts.googleapis.com">
            <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
            <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
                  rel="stylesheet">
        
            <!--    <script type="text/javascript" th:src="@{/js/login.js}"/>-->
</head>
<body>
    <header>
        <div class="logo">📋 SecureOPS</div>
        <nav>
            <a href="#">Домашняя страница</a>
            <a href="#">Информация</a>
            <a href="#">Сервисы</a>
            <a href="#">Контакты</a>
            <button class="book-now">Вход</button>
            <select id="language-select">
                <option value="en">English</option>
                <option value="ru">Русский</option>
            </select>
        </nav>
    </header>
    <main>
        <section class="content">
            <h1>Streamlining Healthcare for a</h1>
            <p>Our software solution is designed to revolutionize the workflow of doctors, providing them with seamless access to information</p>
            <div class="contact">
                <span>📞</span> Contact Us
            </div>
            <div class="appointment">
                Schedule an Appointment
            </div>
        </section>
    </main>
    <script>
        // JavaScript для обработки смены языка
        document.getElementById('language-select').addEventListener('change', function() {
            var selectedLanguage = this.value;
            // Здесь можно добавить логику для смены языка на сайте
            console.log('Выбран язык: ' + selectedLanguage);
            // Например, перенаправление на страницу с выбранным языком
            // window.location.href = '/change-language?lang=' + selectedLanguage;
        });
    </script>
</body>
</html>
