<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страница аутентификации</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" type="text/css" th:href="@{/css/login.css}"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <style>
        /* Стили для контейнера пароля */
        .password-container {
            position: relative;
            width: 100%;
            margin-bottom: 15px;
        }

        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .password-wrapper input[type="password"],
        .password-wrapper input[type="text"] {
            width: 100%;
            padding: 10px;
            padding-right: 40px; /* Отступ для иконки */
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: 'Roboto', sans-serif;
        }

        .toggle-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #666;
            font-size: 16px;
        }

        .toggle-password:hover {
            color: #007bff;
        }

        .caps-warning {
            display: none;
            color: #ff9800;
            font-size: 12px;
            margin-top: 5px;
            font-family: 'Roboto', sans-serif;
        }
    </style>
</head>
<body>
<div class="language-switcher" th:fragment="locale">
    <form action="" method="GET">
        <button type="submit" name="lang" value="ru" class="lang-btn">RU</button>
        <button type="submit" name="lang" value="en" class="lang-btn">EN</button>
    </form>
</div>
<div class="login-container">
    <div class="svg-container">
        <img th:src="@{/img/logo_small.png}" alt="Logo">
    </div>
    <form name="f" method="post" action="/process_login">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <input type="text" th:placeholder="#{login.authorizationForm.username}" name="username" id="username">
        <div class="password-container">
            <div class="password-wrapper">
                <input type="password" th:placeholder="#{login.authorizationForm.password}" name="password" id="password">
                <span class="toggle-password" onclick="togglePassword()" aria-label="Показать пароль">
                    <i class="fas fa-eye"></i>
                </span>
            </div>
            <div class="caps-warning" id="capsWarning">Включен Caps Lock!</div>
        </div>
        <button type="submit" th:text="#{login.authorizationForm.submitButton}"></button>
        <div th:if="${param.error}" style="color: red">
            Неправильные имя или пароль
        </div>
    </form>
</div>

<script type="text/javascript" th:inline="javascript">
    const capsWarning = document.getElementById('capsWarning');

    // Функция для проверки состояния Caps Lock
    function updateCapsLockState(event) {
        const isCapsLockOn = event.getModifierState && event.getModifierState('CapsLock');
        capsWarning.style.display = isCapsLockOn ? 'block' : 'none';
    }

    // Слушатели событий для Caps Lock
    document.addEventListener('keydown', updateCapsLockState);
    document.addEventListener('keyup', updateCapsLockState);
    document.addEventListener('click', updateCapsLockState);

    // Инициализация состояния Caps Lock при загрузке
    document.addEventListener('DOMContentLoaded', function () {
        const event = new KeyboardEvent('keydown');
        updateCapsLockState(event);
    });

    // Переключение видимости пароля
    function togglePassword() {
        const passwordField = document.getElementById("password");
        const toggleIcon = document.querySelector(".toggle-password i");

        if (passwordField.type === "password") {
            passwordField.type = "text";
            toggleIcon.classList.remove("fa-eye");
            toggleIcon.classList.add("fa-eye-slash");
        } else {
            passwordField.type = "password";
            toggleIcon.classList.remove("fa-eye-slash");
            toggleIcon.classList.add("fa-eye");
        }
    }
</script>
</body>
</html>
