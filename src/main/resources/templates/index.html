<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{home.title}">Medical Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" type="text/css" th:href="@{/css/index.css}"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
<header>
    <div class="svg-container">
        <a href="/">
            <img th:src="@{/img/logo_main.png}" alt="Logo">
        </a>
    </div>
    <nav>
        <a th:href="@{/calendar}" th:text="#{home.calendar}">Calendar</a>
        <a th:href="@{/info}" th:text="#{home.info}">Information</a>
        <a th:href="@{/admin/adminPanel}" th:text="#{home.adminPanel}">Admin Panel</a>
        <a th:href="@{/pacient}" th:text="#{patient.names}">Pacient</a>
        <form th:if="${username}" th:action="@{/logout}" th:method="POST">
            <button type="submit" class="logout-btn" th:text="#{home.logout}">Logout</button>
        </form>
        <form th:unless="${username}" action="/auth/login" method="get">
            <button type="submit" class="book-now" th:text="#{home.login}">Login</button>
        </form>
        <form action="">
            <select id="language-select" name="lang" onchange="this.form.submit()">
                <option value="ru" th:selected="${#locale.language == 'ru'}">Русский</option>
                <option value="en" th:selected="${#locale.language == 'en'}">English</option>
            </select>
        </form>
    </nav>
</header>

<main>
    <div class="welcome-container">
        <h2 th:if="${username}" th:text="#{home.welcomeUser(${username})}"></h2>
        <h2 th:unless="${username}" th:text="#{home.welcome}"></h2>
        <p th:text="#{home.description}"></p>
    </div>

    <div class="content-container">
        <div class="calendar-preview">
            <h3 th:text="#{calendar.title}">Event Calendar</h3>
            <p th:text="#{calendar.upcomingEvents}">Upcoming events:</p>
            <ul class="event-list">
                <li>
                    <div class="event-date">
                        <span>31</span>
                        <span th:text="#{calendar.month.march.genitive}"></span>
                    </div>
                    <div class="event-info">
                        <h4 th:text="#{calendar.event1.title}"></h4>
                        <p th:text="#{calendar.event1.desc}"></p>
                    </div>
                </li>
                <li>
                    <div class="event-date">
                        <span>2</span>
                        <span th:text="#{calendar.month.april.genitive}"></span>
                    </div>
                    <div class="event-info">
                        <h4 th:text="#{calendar.event2.title}"></h4>
                        <p th:text="#{calendar.event2.desc}"></p>
                    </div>
                </li>
                <li>
                    <div class="event-date">
                        <span>3</span>
                        <span th:text="#{calendar.month.april.genitive}"></span>
                    </div>
                    <div class="event-info">
                        <h4 th:text="#{calendar.event3.title}"></h4>
                        <p th:text="#{calendar.event3.desc}"></p>
                    </div>
                </li>
            </ul>
            <a th:href="@{/calendar}" class="view-all-btn" th:text="#{calendar.viewAll}"><i class="fas fa-arrow-right"></i></a>
        </div>

        <div class="schedule-container">
            <h3 th:text="#{schedule.title}"></h3>
            <table class="schedule-table">
                <thead>
                <tr>
                    <th th:text="#{schedule.time}"></th>
                    <th th:text="#{schedule.event}"></th>
                </tr>
                </thead>
                <tbody>
                <tr>
                    <td>9:00</td>
                    <td th:text="#{schedule.row1.event}"></td>
                </tr>
                <tr>
                    <td>12:00</td>
                    <td th:text="#{schedule.row2.event}"></td>
                </tr>
                <tr>
                    <td>16:50</td>
                    <td th:text="#{schedule.row3.event}"></td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="links-container">
            <h3 th:text="#{resources.title}"></h3>
            <div class="link-grid">
                <a th:href="@{/pacient}" class="link-card">
                    <i class="fas fa-hospital"></i>
                    <span th:text="#{resources.system1}"></span>
                </a>
                <a href="https://example.com/system2" class="link-card">
                    <i class="fas fa-user-md"></i>
                    <span th:text="#{resources.system2}"></span>
                </a>
                <a href="https://example.com/system3" class="link-card">
                    <i class="fas fa-heartbeat"></i>
                    <span th:text="#{resources.system3}"></span>
                </a>
                <a th:href="@{/info}" class="link-card">
                    <i class="fas fa-info-circle"></i>
                    <span th:text="#{resources.moreInfo}"></span>
                </a>
            </div>
        </div>
    </div>
</main>

<footer>
    <div class="footer-content">
        <div class="footer-links">
            <h4 th:text="#{footer.navigation}"></h4>
            <ul>
                <li><a th:href="@{/}" th:text="#{footer.home}"></a></li>
                <li><a th:href="@{/calendar}" th:text="#{footer.calendar}"></a></li>
                <li><a th:href="@{/info}" th:text="#{footer.info}"></a></li>
            </ul>
        </div>
        <div class="footer-contact">
            <h4 th:text="#{footer.contacts}"></h4>
            <p><i class="fas fa-phone"></i> +7 (999) 444-7745</p>
            <p><i class="fas fa-envelope"></i> <span th:text="#{footer.students}"></span></p>
            <p><i class="fas fa-map-marker-alt"></i> <span th:text="#{footer.address}"></span></p>
        </div>
    </div>
    <div class="footer-bottom">
        <p th:text="#{footer.copyright}"></p>
    </div>
</footer>
</body>
</html>
